name: Release (sign + notarize)

# vX.Y タグを push するとビルド→署名→公証→staple→GitHub Release作成まで自動実行。
# 必要なSecrets（リポジトリ Settings > Secrets and variables > Actions）:
#   DEVELOPER_ID_CERT_P12_BASE64  Developer ID Application証明書(.p12)のbase64
#   DEVELOPER_ID_CERT_PASSWORD    .p12書き出し時のパスワード
#   KEYCHAIN_PASSWORD             CI一時キーチェーンのパスワード（任意の文字列）
#   NOTARY_KEY_P8_BASE64          App Store Connect APIキー(.p8)のbase64
#   NOTARY_KEY_ID                 APIキーのKey ID
#   NOTARY_ISSUER_ID              APIキーのIssuer ID
# 詳細な作り方は .github/workflows/RELEASE_SETUP.md を参照。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # GitHub Release作成に必要

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build + sign .app
        run: ./scripts/build-app.sh

      - name: Notarize + staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          ditto -c -k --keepParent build/GridSwitch.app build/GridSwitch-notarize.zip
          xcrun notarytool submit build/GridSwitch-notarize.zip \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple build/GridSwitch.app
          rm -f build/GridSwitch.zip
          ditto -c -k --keepParent build/GridSwitch.app build/GridSwitch.zip

      - name: Verify Gatekeeper
        run: |
          spctl -a -vvv -t install build/GridSwitch.app
          xcrun stapler validate build/GridSwitch.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/GridSwitch.zip \
            --title "GridSwitch ${GITHUB_REF_NAME}" \
            --generate-notes
